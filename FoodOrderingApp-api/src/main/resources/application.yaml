server:
  port: 8080
  servlet:
    context-path: /api

spring:

  application:
    name: FoodOrderingApp-api

  datasource:
    url: jdbc:postgresql://localhost:5434/restaurantdb
    username: postgres
    password: password

  jpa:
    properties:
      hibernate:
        temp:
          use_jdbc_metadata_defaults: false
    database-platform: org.hibernate.dialect.PostgreSQLDialect
