openapi: 3.0.1
info:
  description: API of Payment Services
  title: Payment API
  version: 1.0.0
servers:
- url: http://FoodOrderingApp.io/api
- url: https://FoodOrderingApp.io/api
tags:
- description: All operations marked with 'API#001 Payment' are relevant to the payment
    use case
  name: API#001 Payment
paths:
  /payment:
    get:
      description: |
        Customer can get a list of all available payment methods.
      operationId: getPaymentMethods
      parameters:
      - description: Mandatory customer credentials in bearer http authentication
          scheme format.
        in: header
        name: authorization
        required: true
        schema:
          type: string
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaymentListResponse'
          description: OK - Payment methods list fetched successfully
        "400":
          content: {}
          description: "BAD REQUEST - server cannot or will not process the request\
            \ due to something that is perceived to be a client error (e.g., malformed\
            \ request syntax, mandatory elements are missing)"
          headers:
            request-id:
              description: Used as correlation id while tracing for the request in
                the backend
              schema:
                type: string
        "401":
          content: {}
          description: UNAUTHORIZED - customer has provided wrong credentials
          headers:
            request-id:
              description: Used as correlation id while tracing for the request in
                the backend
              schema:
                type: string
        "403":
          content: {}
          description: FORBIDDEN - request has not been applied because client application
            has no permission to perform action
          headers:
            request-id:
              description: Used as correlation id while tracing for the request in
                the backend
              schema:
                type: string
        "422":
          content: {}
          description: UNPROCESSABLE ENTITY - request was well-formed but server unable
            to process due to semantic errors
          headers:
            request-id:
              description: Used as correlation id while tracing for the request flow
                to the backend
              schema:
                type: string
        "500":
          content: {}
          description: INTERNAL SERVER ERROR - server encountered an unexpected condition
            that prevented it from fulfilling the request.
          headers:
            request-id:
              description: Used as correlation id while tracing for the request in
                the backend
              schema:
                type: string
      summary: Get payment methods
      tags:
      - API#001 Get payment methods
      x-accepts: application/json
      x-tags:
      - tag: API#001 Get payment methods
    x-swagger-router-controller: api
components:
  parameters:
    BearerAuthorization:
      description: Mandatory customer credentials in bearer http authentication scheme
        format.
      in: header
      name: authorization
      required: true
      schema:
        type: string
  schemas:
    PaymentListResponse:
      properties:
        paymentMethods:
          description: List of payment methods
          items:
            $ref: '#/components/schemas/PaymentResponse'
          type: array
      type: object
    PaymentResponse:
      properties:
        id:
          description: Unique identifier of the payment method in a standard UUID
            format
          format: uuid
          type: string
        payment_name:
          description: Name of the payment method
          type: string
      type: object
    ErrorResponse:
      example:
        code: PAY-001
        message: No payment method found
      properties:
        code:
          description: Application specific standard error code
          type: string
        message:
          description: Error message stating the reason
          type: string
        root_cause:
          description: Root cause of the Error
          type: string
      required:
      - code
      - message
      type: object
  securitySchemes:
    BearerAuthorization:
      description: |
        Bearer authentication (also called token authentication) is an HTTP authentication scheme that involves security tokens called bearer tokens. The name “Bearer authentication” can be understood as “give access to the bearer of this token.”
        The bearer token is a cryptic string, usually generated by the server in response to a login request. The client must send this token in the Authorization header when making requests to protected resources:
        ``` Authorization: Bearer <token>
        ```
        Similarly to Basic authentication, Bearer authentication should only be used over HTTPS (SSL).
        Read https://jwt.io/introduction/ for more information on JWT standard.
      scheme: basic
      type: http
x-original-swagger-version: "2.0"
